##################################################################################
# Open Duck Bipedal (MuJoCo)
##################################################################################

env_type: 'duck'
env_name: 'open_duck_bipedal'
num_env_steps: ${num_env_steps}

seed: ${seed}
num_train_envs: ${num_train_envs}
num_eval_envs: ${num_eval_envs}
num_record_envs: ${num_record_envs}
rescale_action: false   # duck action_space is already Box(-1, 1)
max_episode_steps: 2000 # 40s episode / 0.02s control dt = 2000 steps; matches env's own truncation
